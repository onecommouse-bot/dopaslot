<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17152a">
<title>ドパスロ - カードめくり</title>
<style>
:root{--bg:#17152a;--ink:#f3f1fa;--sub:#a29fbd;--N:#8b93a8;--R:#2fa89f;--SR:#9262f2;--SSR:#f3b52f;--UR:#ff3366}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overscroll-behavior:none}
#feed{height:100dvh;overflow:hidden;touch-action:none}
.slide{height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card{--c:var(--N);width:min(74vw,340px);aspect-ratio:2/3;border:3px solid var(--c);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,var(--bg)),var(--bg) 72%);transform:scale(.9);opacity:.5;transition:transform .35s ease,opacity .35s ease;position:relative;overflow:hidden}
.slide.on .card{transform:scale(1);opacity:1}
.card.R{--c:var(--R)}.card.SR{--c:var(--SR)}.card.SSR{--c:var(--SSR)}.card.UR{--c:var(--UR)}
.card.SR,.card.SSR,.card.UR{box-shadow:0 0 28px color-mix(in srgb,var(--c) 55%,transparent)}
.card.UR{box-shadow:0 0 35px color-mix(in srgb,var(--c) 70%,#fff)}
/* 文字なしの全面画像・動画表示 */
.card.full-img{padding:0;border:3px solid var(--c)}
.rar{font-size:1.4rem;font-weight:800;color:var(--c);letter-spacing:.04em;z-index:2;text-shadow:1px 1px 2px rgba(0,0,0,0.8)}
.art{flex:1;display:grid;place-items:center;font-size:4.5rem;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff);opacity:.85;width:100%;height:100%}
.art img, .art video{width:100%;height:100%;object-fit:cover;display:block}
.name{font-size:1.15rem;font-weight:700;z-index:2;text-shadow:1px 1px 2px rgba(0,0,0,0.8)}
.fx{position:absolute;inset:0;pointer-events:none;display:none}
.fx video{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.slide.on .fx.flash{display:block;background:radial-gradient(circle at 50% 50%,#fff,var(--fc) 45%,transparent 75%);animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;font-size:.9rem;color:var(--sub);pointer-events:none}
#bar button{pointer-events:auto}
button{font:inherit;color:var(--ink);background:#2b2850;border:1px solid #433f7a;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--SSR);outline-offset:2px}
#start{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;text-align:center;padding:24px}
#start h1{font-size:1.6rem}
#start p{color:var(--sub);font-size:.95rem;line-height:1.7}
#start button{font-size:1.1rem;padding:12px 36px;background:var(--SSR);color:#2a1d00;border:0;font-weight:700}
dialog{margin:auto;width:min(86vw,360px);border:1px solid #433f7a;border-radius:16px;background:#221f3d;color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:1.1rem;margin-bottom:12px}
dialog li{display:flex;justify-content:space-between;list-style:none;padding:6px 0;border-bottom:1px solid #35316a;font-size:.92rem}
dialog ul{margin-bottom:16px;padding:0}
@media (prefers-reduced-motion:reduce){.card{transition:none}.slide.on .fx.flash{animation:none;display:none}}
</style>
</head>
<body>

<div id="start">
  <h1>ドパスロ</h1>
  <p>上にスワイプするたびに、新しいカードが出ます。<br>レアな動物には特別な演出があります。</p>
  <button id="startBtn" type="button">はじめる</button>
</div>

<div id="bar">
  <span id="count"></span>
  <button id="ratesBtn" type="button">排出確率</button>
</div>

<main id="feed" aria-label="カード一覧"></main>

<dialog id="rates">
  <h2>カード別 排出確率</h2>
  <ul id="ratesList"></ul>
  <button id="ratesClose" type="button">閉じる</button>
</dialog>

<script>
/* ========== 設定 ========== */

const FLASH = { SR: '#9262f2', SSR: '#f3b52f', UR: '#ff3366' };

// 動物15種（合計100%）。以前のデモ枠1.25%を新しい7種の動画カードに分配しています
const CARDS = [
  // 画像カード（N・R）
  { id: 'frog',     name: 'アマガエル',       rate: 40,   grade: 'N',   icon: '🐸', img: 'cards/frog.jpg' },
  { id: 'sparrow',  name: 'スズメ',           rate: 30,   grade: 'N',   icon: '🐦', img: 'cards/sparrow.jpg' },
  { id: 'squirrel', name: 'リス',             rate: 20,   grade: 'N',   icon: '🐿️', img: 'cards/squirrel.jpg' },
  { id: 'rabbit',   name: 'ウサギ',           rate: 5,    grade: 'R',   icon: '🐇', img: 'cards/rabbit.jpg' },
  { id: 'fox',      name: 'アカギツネ',       rate: 2,    grade: 'R',   icon: '🦊', img: 'cards/fox.jpg' },
  { id: 'owl',      name: 'メンフクロウ',     rate: 1,    grade: 'SR',  icon: '🦉', img: 'cards/owl.jpg' },
  { id: 'turtle',   name: 'ウミガメ',         rate: 0.5,  grade: 'SR',  icon: '🐢', img: 'cards/turtle.jpg' },
  { id: 'kangaroo', name: 'カンガルー',       rate: 0.25, grade: 'SSR', icon: '🦘', img: 'cards/kangaroo.jpg' },
  
  // 動画カード（SR・SSR・UR）
  { id: 'wolf',     name: 'シンリンオオカミ', rate: 0.4,  grade: 'SR',  icon: '🐺', video: 'videos/wolf.mp4' },
  { id: 'eagle',    name: 'イヌワシ',         rate: 0.4,  grade: 'SR',  icon: '🦅', video: 'videos/eagle.mp4' },
  { id: 'polarbear',name: 'ホッキョクグマ',   rate: 0.2,  grade: 'SR',  icon: '🐻‍❄️', video: 'videos/polarbear.mp4' },
  { id: 'lion',     name: 'ライオン',         rate: 0.1,  grade: 'SSR', icon: '🦁', video: 'videos/lion.mp4' },
  { id: 'whale',    name: 'シロナガスクジラ', rate: 0.1,  grade: 'SSR', icon: '🐳', video: 'videos/whale.mp4' },
  { id: 'dragon',   name: '紅蓮竜 ドラゴン',  rate: 0.03, grade: 'UR',  icon: '🐉', video: 'videos/dragon.mp4' },
  { id: 'phoenix',  name: 'フェニックス',     rate: 0.02, grade: 'UR',  icon: '🔥', video: 'videos/phoenix.mp4' }
];

/* ========== 抽選 ========== */

function drawCard() {
  const total = CARDS.reduce((sum, c) => sum + c.rate, 0);
  let r = Math.random() * total;
  for (const card of CARDS) {
    if ((r -= card.rate) < 0) return card;
  }
  return CARDS[0];
}

/* ========== 図鑑の保存 ========== */

let owned = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem('owned_dopaslot') || '[]')); } catch (e) {}

function collect(id) {
  owned.add(id);
  try { localStorage.setItem('owned_dopaslot', JSON.stringify([...owned])); } catch (e) {}
  renderCount();
}

function renderCount() {
  document.getElementById('count').textContent = `図鑑 ${owned.size} / ${CARDS.length}`;
}

/* ========== 画面描画 ========== */

const feed = document.getElementById('feed');
let slides = [];

function makeSlide(card) {
  const s = document.createElement('section');
  s.className = 'slide';
  s._card = card;

  // 画像または動画がある場合はカード一面（文字なし）に表示
  if (card.img) {
    s.innerHTML = `
      <article class="card ${card.grade} full-img">
        <div class="art">
          <img src="${card.img}" alt="${card.name}" loading="lazy"
               onerror="this.closest('.card').classList.remove('full-img'); this.parentElement.innerHTML='${card.icon}';">
        </div>
      </article>`;
  } else if (card.video) {
    // 動画の場合は背景を黒にして再生
    s.innerHTML = `
      <article class="card ${card.grade} full-img">
        <div class="art">
          <video src="${card.video}" playsinline muted loop autoplay preload="auto"></video>
        </div>
      </article>`;
  } else {
    s.innerHTML = `
      <article class="card ${card.grade}">
        <div class="rar">${card.rate}%</div>
        <div class="art">${card.icon || card.name}</div>
        <div class="name">${card.name}</div>
      </article>`;
  }

  // フラッシュ演出
  if (FLASH[card.grade]) {
    const fx = document.createElement('div');
    fx.className = 'fx flash';
    fx.style.setProperty('--fc', FLASH[card.grade]);
    s.appendChild(fx);
  }

  // 背景の全画面動画エフェクト（任意）
  if (card.video) {
    const box = document.createElement('div');
    box.className = 'fx';
    box.style.display = 'block';
    box.innerHTML = `<video src="${card.video}" playsinline muted preload="auto"></video>`;
    box.querySelector('video').addEventListener('ended', e => e.target.style.opacity = 0);
    s.appendChild(box);
  }

  return s;
}

function addSlides(n) {
  for (let i = 0; i < n; i++) {
    const s = makeSlide(drawCard());
    feed.appendChild(s);
    slides.push(s);
    observer.observe(s);
  }
}

const observer = new IntersectionObserver(entries => {
  for (const e of entries) {
    const s = e.target;
    if (e.isIntersecting) {
      s.classList.remove('on'); void s.offsetWidth;
      s.classList.add('on');
      collect(s._card.id);
      
      // 全画面演出の動画がある場合は再生
      const fullscreenVideo = s.querySelector('.fx > video');
      if (fullscreenVideo) { 
        fullscreenVideo.style.opacity = 1; 
        fullscreenVideo.currentTime = 0; 
        fullscreenVideo.play().catch(() => {}); 
      }
      
      // カード枠内の動画がある場合は再生
      const cardVideo = s.querySelector('.art > video');
      if (cardVideo) { 
        cardVideo.currentTime = 0; 
        cardVideo.play().catch(() => {}); 
      }

      if (slides.indexOf(s) >= slides.length - 2) addSlides(5);
    } else {
      s.classList.remove('on');
      const videos = s.querySelectorAll('video');
      videos.forEach(v => {
        v.pause();
        if(v.parentElement.className === 'fx') v.style.opacity = 0;
      });
    }
  }
}, { root: feed, threshold: 0.6 });

/* ========== ボタン・ダイアログ操作 ========== */

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('start').remove();
});

const dlg = document.getElementById('rates');
document.getElementById('ratesList').innerHTML =
  CARDS.map(c => `<li><span>${c.name}</span><span>${c.rate}%</span></li>`).join('');
document.getElementById('ratesBtn').addEventListener('click', () => dlg.showModal());
document.getElementById('ratesClose').addEventListener('click', () => dlg.close());

/* ========== 操作制御（スワイプ・ホイール） ========== */

let cur = 0;
let lockUntil = 0;
const LOCK_MS = 100;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function go(dir) {
  const now = Date.now();
  if (now < lockUntil) return;
  const next = cur + dir;
  if (next < 0) return;
  if (next >= slides.length) addSlides(1);
  cur = next;
  lockUntil = now + LOCK_MS;
  feed.scrollTo({ top: cur * feed.clientHeight, behavior: reduceMotion ? 'auto' : 'smooth' });
}

let touchY = null;
feed.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
feed.addEventListener('touchend', e => {
  if (touchY === null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  touchY = null;
  if (Math.abs(dy) > 10) go(dy > 0 ? 1 : -1);
}, { passive: true });

feed.addEventListener('wheel', e => {
  e.preventDefault();
  if (Date.now() < lockUntil) { lockUntil = Math.max(lockUntil, Date.now() + 120); return; }
  if (Math.abs(e.deltaY) > 8) go(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (dlg.open) return;
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
});

window.addEventListener('resize', () => feed.scrollTo({ top: cur * feed.clientHeight, behavior: 'auto' }));

renderCount();
addSlides(5);
</script>
</body>
</html>
